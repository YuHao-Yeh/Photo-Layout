<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
  <!-- Aero Sky: open sky with soft clouds, light rays and floating bubbles. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb8ee"/>
      <stop offset=".45" stop-color="#a9d6f8"/>
      <stop offset=".8" stop-color="#e3f2fe"/>
      <stop offset="1" stop-color="#f6fbff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".95" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="b">
      <circle r="1" fill="url(#bubble)"/>
      <ellipse cx="-.35" cy="-.4" rx=".28" ry=".16" fill="#fff" opacity=".85" transform="rotate(-35 -.35 -.4)"/>
      <circle cx=".38" cy=".42" r=".07" fill="#fff" opacity=".6"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#sun)"/>
  <g fill="url(#ray)">
    <polygon points="1020,0 1100,0 760,800 600,800"/>
    <polygon points="1130,0 1170,0 1020,800 930,800"/>
    <polygon points="940,0 980,0 420,800 330,800" opacity=".6"/>
  </g>
  <!-- High wispy clouds -->
  <g fill="#fff" filter="url(#softer)" opacity=".7">
    <ellipse cx="220" cy="150" rx="150" ry="22"/>
    <ellipse cx="330" cy="135" rx="90" ry="16"/>
    <ellipse cx="760" cy="230" rx="170" ry="20"/>
  </g>
  <!-- Cloud bank along the bottom -->
  <g fill="#fff" filter="url(#soft)">
    <ellipse cx="80" cy="690" rx="190" ry="90"/>
    <ellipse cx="300" cy="720" rx="210" ry="95"/>
    <ellipse cx="560" cy="700" rx="230" ry="100"/>
    <ellipse cx="820" cy="725" rx="220" ry="95"/>
    <ellipse cx="1080" cy="690" rx="220" ry="100"/>
    <rect x="-50" y="740" width="1300" height="120"/>
  </g>
  <g fill="#fff" opacity=".9">
    <circle cx="200" cy="640" r="60"/><circle cx="270" cy="615" r="75"/><circle cx="350" cy="650" r="55"/>
    <circle cx="860" cy="645" r="65"/><circle cx="940" cy="610" r="85"/><circle cx="1030" cy="650" r="60"/>
  </g>
  <!-- Floating bubbles -->
  <use href="#b" transform="translate(140 300) scale(48)"/>
  <use href="#b" transform="translate(250 430) scale(22)"/>
  <use href="#b" transform="translate(420 210) scale(30)"/>
  <use href="#b" transform="translate(600 380) scale(16)"/>
  <use href="#b" transform="translate(700 120) scale(26)"/>
  <use href="#b" transform="translate(900 360) scale(56)"/>
  <use href="#b" transform="translate(1080 250) scale(20)"/>
  <use href="#b" transform="translate(1110 480) scale(34)"/>
  <use href="#b" transform="translate(60 520) scale(18)"/>
</svg>
