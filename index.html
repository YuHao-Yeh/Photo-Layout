<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photo Layout">
  <title>Photo Layout</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>
    // Apply the saved theme before first paint (app.js keeps it in sync later).
    (function () {
      var theme = "sky";
      try { theme = JSON.parse(localStorage.getItem("photo-layout:settings") || "{}").theme || theme; } catch (e) {}
      document.documentElement.dataset.theme = theme;
      if (theme !== "classic") document.documentElement.classList.add("aero");
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="appTitle">Photo Layout</h1>
    <div class="topbar-end">
      <span id="paperLabel" class="paper-label"></span>
      <button type="button" class="lang-toggle" data-action="language"
        data-i18n="switchLanguage" data-i18n-label="switchLanguageLabel">中文</button>
    </div>
  </header>

  <main id="stage">
    <div id="empty" class="empty">
      <p class="empty-title" data-i18n="emptyTitle">Lay out 2–12 photos on one page</p>
      <p class="empty-hint" data-i18n="emptyHint"></p>
      <button type="button" class="button primary" data-action="add" data-i18n="addPhotos">Add photos</button>
    </div>
    <canvas id="page" hidden></canvas>
    <div id="busy" class="busy" hidden data-i18n="loading">Loading photos…</div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <nav id="mainBar" class="bar">
    <button type="button" id="addBtn" data-action="add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="add">Add</span>
    </button>
    <button type="button" id="nextBtn" data-action="next">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="11" rx="1"/><rect x="13" y="3" width="8" height="6" rx="1"/><rect x="13" y="11" width="8" height="10" rx="1"/><rect x="3" y="16" width="8" height="5" rx="1"/></svg>
      <span><span data-i18n="layout">Layout</span> <span id="layoutCount"></span></span>
    </button>
    <button type="button" data-action="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span data-i18n="settings">Settings</span>
    </button>
    <button type="button" id="exportBtn" data-action="export">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg><span data-i18n="export">Export</span>
    </button>
  </nav>

  <!-- Second rows of the photo toolbar, opened by its group buttons. -->
  <nav id="transformBar" class="bar subbar" hidden>
    <button type="button" data-action="rotate">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span data-i18n="rotate">Rotate</span>
    </button>
    <button type="button" data-action="zoomOut">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg><span data-i18n="smaller">Smaller</span>
    </button>
    <button type="button" data-action="zoomIn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg><span data-i18n="larger">Larger</span>
    </button>
    <button type="button" id="fitBtn" data-action="fit">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="8" width="10" height="8" rx="1"/></svg><span data-i18n="wholePhoto">Whole photo</span>
    </button>
    <button type="button" data-action="reset">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span data-i18n="reset">Reset</span>
    </button>
  </nav>

  <nav id="photoBar" class="bar subbar" hidden>
    <button type="button" id="swapBtn" data-action="swap">
      <svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/></svg><span data-i18n="swap">Swap</span>
    </button>
    <button type="button" data-action="replace">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg><span data-i18n="replace">Replace</span>
    </button>
    <button type="button" class="danger" data-action="remove">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-i18n="remove">Remove</span>
    </button>
  </nav>

  <nav id="cellBar" class="bar" hidden>
    <button type="button" data-action="group" data-group="transform">
      <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span data-i18n="groupTransform">Zoom &amp; Rotate</span>
    </button>
    <button type="button" data-action="adjust">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-i18n="adjust">Adjust</span>
    </button>
    <button type="button" data-action="group" data-group="photo">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span data-i18n="groupPhoto">Photo</span>
    </button>
    <button type="button" data-action="deselect">
      <svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="done">Done</span>
    </button>
  </nav>

  <section id="adjustPanel" class="adjust-panel" hidden>
    <div class="presets">
      <button type="button" data-preset="original" data-i18n="presetOriginal">Original</button>
      <button type="button" data-preset="bw" data-i18n="presetBW">B&amp;W</button>
      <button type="button" data-preset="vivid" data-i18n="presetVivid">Vivid</button>
      <button type="button" data-preset="warm" data-i18n="presetWarm">Warm</button>
      <button type="button" data-preset="cool" data-i18n="presetCool">Cool</button>
    </div>
    <form id="adjustForm" class="sliders">
      <label><span data-i18n="brightness">Brightness</span><input type="range" name="brightness" min="-100" max="100" step="1"><output></output></label>
      <label><span data-i18n="contrast">Contrast</span><input type="range" name="contrast" min="-100" max="100" step="1"><output></output></label>
      <label><span data-i18n="saturation">Saturation</span><input type="range" name="saturation" min="-100" max="100" step="1"><output></output></label>
      <label><span data-i18n="warmth">Warmth</span><input type="range" name="warmth" min="-100" max="100" step="1"><output></output></label>
    </form>
    <div class="adjust-actions">
      <button type="button" class="button" data-action="adjustReset" data-i18n="reset">Reset</button>
      <button type="button" class="button primary" data-action="adjustDone" data-i18n="done">Done</button>
    </div>
  </section>

  <input id="fileInput" type="file" accept="image/*" multiple hidden>
  <input id="replaceInput" type="file" accept="image/*" hidden>

  <dialog id="settingsDialog">
    <form id="settingsForm" method="dialog" class="sheet">
      <header class="sheet-head">
        <h2 data-i18n="settings">Settings</h2>
        <button class="link" value="close" data-i18n="done">Done</button>
      </header>
      <h3 class="section-title" data-i18n="paper">Paper</h3>
      <label class="field"><span data-i18n="size">Size</span>
        <select name="paper"></select>
      </label>
      <div id="customSize" class="field two" hidden>
        <label><span data-i18n="width">Width (mm)</span><input type="number" name="customWidth" min="20" max="1000" step="1" inputmode="decimal"></label>
        <label><span data-i18n="height">Height (mm)</span><input type="number" name="customHeight" min="20" max="1000" step="1" inputmode="decimal"></label>
      </div>
      <fieldset class="field segmented">
        <legend data-i18n="orientation">Orientation</legend>
        <label><input type="radio" name="orientation" value="portrait"><span data-i18n="portrait">Portrait</span></label>
        <label><input type="radio" name="orientation" value="landscape"><span data-i18n="landscape">Landscape</span></label>
        <label><input type="radio" name="orientation" value="auto"><span data-i18n="bestFit">Best fit</span></label>
      </fieldset>
      <label class="field"><span><span data-i18n="margin">Margin</span> <output id="marginOut"></output></span>
        <input type="range" name="margin" min="0" max="25" step="1">
      </label>
      <label class="field"><span><span data-i18n="gap">Space between photos</span> <output id="gapOut"></output></span>
        <input type="range" name="gap" min="0" max="15" step="1">
      </label>
      <label class="field check">
        <input type="checkbox" name="allowRotate"> <span data-i18n="allowRotate">Rotate photos to fit better</span>
      </label>
      <label class="field inline"><span data-i18n="paperColor">Paper colour</span>
        <input type="color" name="background">
      </label>
      <h3 class="section-title" data-i18n="appearance">Appearance</h3>
      <div class="field">
        <span data-i18n="theme">Theme</span>
        <div class="theme-picker">
          <label><input type="radio" name="theme" value="sky"><span class="swatch swatch-sky"></span><span data-i18n="themeSky">Aero Sky</span></label>
          <label><input type="radio" name="theme" value="wave"><span class="swatch swatch-wave"></span><span data-i18n="themeWave">Aero Wave</span></label>
          <label><input type="radio" name="theme" value="candy"><span class="swatch swatch-candy"></span><span data-i18n="themeCandy">Aero Candy</span></label>
          <label><input type="radio" name="theme" value="classic"><span class="swatch swatch-classic"></span><span data-i18n="themeClassic">Classic</span></label>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="exportDialog">
    <form method="dialog" class="sheet">
      <header class="sheet-head">
        <h2 data-i18n="export">Export</h2>
        <button class="link" value="close" data-i18n="close">Close</button>
      </header>
      <label class="field"><span data-i18n="quality">Quality</span>
        <select id="dpiSelect">
          <option value="150" data-i18n="dpiStandard">Standard (150 dpi)</option>
          <option value="300" data-i18n="dpiPrint">Print (300 dpi)</option>
        </select>
      </label>
      <div class="field two">
        <button type="button" class="button primary" data-action="makePdf" data-i18n="createPdf">Create PDF</button>
        <button type="button" class="button primary" data-action="makeJpg" data-i18n="createJpg">Create JPG</button>
      </div>
      <p id="exportStatus" class="status" role="status"></p>
      <div id="exportResult" class="field two" hidden>
        <button type="button" id="shareBtn" class="button" data-action="share" data-i18n="share">Share / Save…</button>
        <a id="downloadLink" class="button" download data-i18n="download">Download</a>
      </div>
    </form>
  </dialog>

</body>
</html>
